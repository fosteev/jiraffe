<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jiraffe prototype</title>
<style>
/* Layout: replica of a VS Code window — activity bar · sidebar with tree views · editor tabs with webview card · status bar */
:root{
  --page:#e9ecf0; --title:#f8f8f8; --act:#f8f8f8; --side:#f8f8f8; --ed:#ffffff; --tabs:#f8f8f8; --tab-on:#ffffff;
  --bd:#e5e5e5; --fg:#3b3b3b; --fg2:#1f1f1f; --mut:#6e7681; --acc:#005fb8; --acc-fg:#ffffff; --link:#005fb8;
  --hov:#ececec; --sel:#dbe6f6; --in:#ffffff; --in-bd:#cecece; --badge:#d6d8db; --badge-fg:#1f1f1f; --shadow:rgba(20,30,50,.18);
  --todo-bg:#e9eaec; --todo:#4a4f57; --prog-bg:#dbeafe; --prog:#0b5cad; --rev-bg:#fbefd0; --rev:#7f5300; --done-bg:#dcf2e3; --done:#1f7a3d;
  --red:#d1242f; --orange:#c96a0a; --green:#1f8a3d; --blue:#2f6fd6; --purple:#8250df; --warn:#bf8700; --track:#e3e6ea;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Ubuntu,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"JetBrains Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0e0f11; --title:#1f1f1f; --act:#181818; --side:#181818; --ed:#1f1f1f; --tabs:#181818; --tab-on:#1f1f1f;
  --bd:#2b2b2b; --fg:#cccccc; --fg2:#ececec; --mut:#9d9d9d; --acc:#0078d4; --acc-fg:#ffffff; --link:#4daafc;
  --hov:#2a2d2e; --sel:#04395e; --in:#2a2a2a; --in-bd:#3c3c3c; --badge:#4d4d4d; --badge-fg:#f0f0f0; --shadow:rgba(0,0,0,.55);
  --todo-bg:#33363b; --todo:#c3c7cd; --prog-bg:#0d3352; --prog:#7cc0ff; --rev-bg:#3d300f; --rev:#e6c27a; --done-bg:#183623; --done:#7ad19a;
  --red:#f47067; --orange:#f0883e; --green:#57ab5a; --blue:#539bf5; --purple:#b083f0; --warn:#d29922; --track:#2f3236;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0e0f11; --title:#1f1f1f; --act:#181818; --side:#181818; --ed:#1f1f1f; --tabs:#181818; --tab-on:#1f1f1f;
  --bd:#2b2b2b; --fg:#cccccc; --fg2:#ececec; --mut:#9d9d9d; --acc:#0078d4; --acc-fg:#ffffff; --link:#4daafc;
  --hov:#2a2d2e; --sel:#04395e; --in:#2a2a2a; --in-bd:#3c3c3c; --badge:#4d4d4d; --badge-fg:#f0f0f0; --shadow:rgba(0,0,0,.55);
  --todo-bg:#33363b; --todo:#c3c7cd; --prog-bg:#0d3352; --prog:#7cc0ff; --rev-bg:#3d300f; --rev:#e6c27a; --done-bg:#183623; --done:#7ad19a;
  --red:#f47067; --orange:#f0883e; --green:#57ab5a; --blue:#539bf5; --purple:#b083f0; --warn:#d29922; --track:#2f3236;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--page);color:var(--fg);font:13px/1.4 var(--ui);padding:20px 16px 32px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--acc);outline-offset:-1px}
.cap{max-width:1360px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.cap b{font-size:15px;color:var(--fg2)} .cap span{color:var(--mut)}
.win{max-width:1360px;margin:0 auto;height:820px;display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--ed);box-shadow:0 14px 44px var(--shadow);position:relative}
svg{flex:none}
.titlebar{height:34px;flex:none;background:var(--title);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 12px}
.lights{display:flex;gap:8px;width:120px}.lights i{width:12px;height:12px;border-radius:50%;display:block}
.tb-search{flex:1;max-width:460px;margin:0 auto;height:22px;border:1px solid var(--in-bd);background:var(--in);border-radius:6px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-size:12px}
.tb-search svg{width:14px;height:14px}
.tb-r{width:120px}
.main{flex:1;display:flex;min-height:0}
.act{width:48px;flex:none;background:var(--act);border-right:1px solid var(--bd);display:flex;flex-direction:column}
.act button{width:48px;height:48px;border:0;background:none;color:var(--mut);display:grid;place-items:center;position:relative;cursor:pointer}
.act button.on{color:var(--fg2)}.act button.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc)}
.act svg{width:24px;height:24px}
.side{width:320px;flex:none;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.side-h{height:35px;display:flex;align-items:center;padding:0 8px 0 20px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;flex:none}
.side-h .acts{margin-left:auto;display:flex;gap:2px}
.side-scroll{flex:1;overflow:auto}
.view-h{height:22px;display:flex;align-items:center;padding-right:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;border-top:1px solid var(--bd);user-select:none;position:sticky;top:0;background:var(--side);z-index:2}
.view-h .acts{margin-left:auto;display:flex;gap:1px;opacity:.8}
.tw{width:18px;height:22px;display:grid;place-items:center;flex:none;color:var(--fg)}
.tw svg{width:14px;height:14px;transition:transform .12s}
.tw.open svg,.view:not(.collapsed)>.view-h .tw svg{transform:rotate(90deg)}
.view.collapsed>.view-b{display:none}
.view-b{padding-bottom:8px}
.ib{width:22px;height:22px;border:0;background:none;color:var(--fg);border-radius:4px;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--hov)}.ib svg{width:16px;height:16px}
.row{height:22px;display:flex;align-items:center;gap:6px;padding-right:10px;cursor:pointer;white-space:nowrap;overflow:hidden}
.row:hover{background:var(--hov)}.row.on{background:var(--sel)}
.row .lbl{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.row .desc{color:var(--mut);font-size:12px}
.row.inst{font-weight:600}.row.inst .desc{font-weight:400}
.row svg.s16{width:16px;height:16px;color:var(--mut)}
.grp{font-size:11px;color:var(--mut);padding:6px 0 2px 22px;text-transform:uppercase;letter-spacing:.05em}
.empty{color:var(--mut);font-size:12px;padding:4px 10px 4px 40px;white-space:normal}
.k{font-family:var(--mono);font-size:12px;color:var(--fg2)}
.badge{min-width:18px;height:16px;padding:0 5px;border-radius:8px;background:var(--badge);color:var(--badge-fg);font-size:11px;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-weight:400}
.tg{font-size:10px;border:1px solid var(--in-bd);color:var(--mut);border-radius:3px;padding:0 4px;font-weight:400;letter-spacing:.02em}
.ti{width:14px;height:14px}.pi{width:14px;height:14px}
.av{border-radius:50%;color:#fff;display:inline-grid;place-items:center;font-weight:600;flex:none;letter-spacing:0;line-height:1}
.pill{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:3px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;flex:none}
.pill.sm{height:15px;font-size:9.5px;padding:0 5px}
.s-todo{background:var(--todo-bg);color:var(--todo)}.s-prog{background:var(--prog-bg);color:var(--prog)}.s-review{background:var(--rev-bg);color:var(--rev)}.s-done{background:var(--done-bg);color:var(--done)}.s-canc{background:var(--todo-bg);color:var(--todo)}
.pill-btn{border:0;cursor:pointer}.pill-btn:hover{filter:brightness(1.15)}

/* issues view controls */
.ctl{padding:6px 12px 6px 20px;display:flex;flex-direction:column;gap:6px}
.seg{display:flex;border:1px solid var(--in-bd);border-radius:4px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--in);padding:3px 0;cursor:pointer;color:var(--mut);font-size:12px}
.seg button+button{border-left:1px solid var(--in-bd)}
.seg button.on{background:var(--acc);color:var(--acc-fg)}
.inp{height:24px;border:1px solid var(--in-bd);background:var(--in);border-radius:3px;padding:0 6px;display:flex;align-items:center;gap:6px;width:100%}
.inp input{border:0;background:none;outline:0;flex:1;min-width:0;font-size:12.5px}
.inp svg{width:14px;height:14px;color:var(--mut)}
.inp:focus-within{border-color:var(--acc)}
select.sel{height:24px;border:1px solid var(--in-bd);background:var(--in);border-radius:3px;padding:0 4px;width:100%;font-size:12.5px}
textarea.jql{width:100%;min-height:64px;border:1px solid var(--in-bd);background:var(--in);border-radius:3px;padding:5px 6px;font:12px/1.45 var(--mono);resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 4px 0 7px;border-radius:10px;background:var(--sel);color:var(--fg2);font-size:11.5px;border:0;cursor:pointer}
.chip svg{width:12px;height:12px}
.lnk{border:0;background:none;color:var(--link);cursor:pointer;padding:0;font-size:12px}
.lnk:hover{text-decoration:underline}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{height:26px;padding:0 11px;border-radius:4px;border:1px solid var(--in-bd);background:var(--in);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;font-size:12.5px}
.btn:hover{background:var(--hov)}
.btn svg{width:14px;height:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.btn.pri:hover{filter:brightness(1.08);background:var(--acc)}
.btn.sm{height:22px;padding:0 8px;font-size:12px}
.btn.wide{width:100%;justify-content:center}
.mini{width:44px;height:4px;border-radius:2px;background:var(--track);overflow:hidden;display:flex;flex:none}
.mini i,.bar i{display:block;height:100%}
.b-done{background:var(--green)}.b-prog{background:var(--blue)}.b-rev{background:var(--warn)}.b-acc{background:var(--acc)}.b-over{background:var(--red)}

/* tempo sidebar */
.tp{padding:6px 14px 4px 20px;display:flex;flex-direction:column;gap:10px}
.tp-top{display:flex;align-items:flex-end;justify-content:space-between}
.big{font-size:22px;font-weight:600;color:var(--fg2);font-variant-numeric:tabular-nums;line-height:1.1}
.sm{font-size:12px}.mut{color:var(--mut)}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--track)}
.wk{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end}
.wk div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.wk .col{width:100%;height:50px;background:var(--track);border-radius:3px;display:flex;align-items:flex-end;overflow:hidden}
.wk .col i{display:block;width:100%}
.wk .today{color:var(--fg2);font-weight:600}
.tl{display:flex;flex-direction:column}
.tl .row{padding-left:0;gap:8px}
.tl .row .t{font-variant-numeric:tabular-nums;color:var(--fg2)}

/* editor */
.editor{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--ed)}
.tabs{height:35px;flex:none;background:var(--tabs);display:flex;overflow-x:auto;overflow-y:hidden;border-bottom:1px solid var(--bd)}
.tab{display:flex;align-items:center;gap:6px;padding:0 4px 0 12px;border-right:1px solid var(--bd);cursor:pointer;color:var(--mut);white-space:nowrap;position:relative;flex:none;margin-bottom:-1px}
.tab.on{background:var(--tab-on);color:var(--fg2)}
.tab.on::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--acc)}
.tab .ib{width:20px;height:20px;visibility:hidden}.tab.on .ib,.tab:hover .ib{visibility:visible}
.tab .ib svg{width:14px;height:14px}
.tab svg.s16{width:16px;height:16px}
.pane{flex:1;overflow:auto;background:var(--ed);min-height:0}
.iv{padding:18px 28px 48px;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:12px 32px;max-width:1120px}
.iv-head{grid-column:1/-1}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;flex-wrap:wrap}
.crumbs svg{width:14px;height:14px}
h1{font-size:20px;line-height:1.3;font-weight:600;color:var(--fg2);margin:8px 0 10px;text-wrap:balance}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hrow .sp{flex:1}
.prio{display:inline-flex;align-items:center;gap:4px;font-size:12.5px}
.subtabs{display:flex;gap:20px;border-bottom:1px solid var(--bd);margin-bottom:16px;overflow-x:auto}
.subtabs button{border:0;background:none;color:var(--mut);padding:8px 0 7px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
.subtabs button.on{color:var(--fg2);border-color:var(--acc)}
.cnt{background:var(--badge);color:var(--badge-fg);border-radius:9px;padding:0 6px;font-size:11px;font-variant-numeric:tabular-nums}
.rich{max-width:72ch;line-height:1.6}
.rich h4{margin:16px 0 4px;font-size:13px;color:var(--fg2)}
.rich p{margin:0 0 8px}.rich ol{margin:0 0 8px;padding-left:22px}
code{font-family:var(--mono);font-size:12px;background:var(--hov);padding:1px 4px;border-radius:3px}
pre{font:12px/1.5 var(--mono);background:var(--side);border:1px solid var(--bd);border-radius:4px;padding:10px 12px;overflow-x:auto;margin:0 0 8px}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.att{border:1px solid var(--bd);border-radius:6px;overflow:hidden;background:var(--side);display:flex;flex-direction:column;min-width:0}
.att .th{height:160px;display:grid;place-items:center;background:var(--hov);cursor:zoom-in;overflow:hidden;border:0;padding:0;width:100%}
.att .th svg{height:148px;width:auto}
.att .th.file{cursor:default;color:var(--mut);gap:4px;align-content:center;font:600 13px var(--mono)}
.att .th.file svg{height:40px;width:40px}
.att .inf{padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.att .nm{color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .ab{display:flex;gap:6px;padding:0 10px 10px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.cm{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.cm:last-child{border-bottom:0}
.cm .who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:3px}
.cm .who b{color:var(--fg2);font-weight:600}
.cm .tx{line-height:1.55;max-width:72ch}
.ro-note{margin-top:12px;border:1px dashed var(--in-bd);border-radius:4px;padding:8px 10px;color:var(--mut);font-size:12px}
.hi{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.hi .who{margin-bottom:3px}.hi .who b{color:var(--fg2);font-weight:600}
.chg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.chg .f{color:var(--mut);min-width:90px}
.old{text-decoration:line-through;color:var(--mut)}
.arr{color:var(--mut)}
.tw-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-weight:600;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--hov)}
table.t tfoot td{font-weight:600;color:var(--fg2);border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.who-c{display:flex;align-items:center;gap:6px;white-space:nowrap}
.cell{cursor:pointer;border-radius:3px}
.cell:hover{background:var(--sel)}
.under{color:var(--warn)}
.src{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta{font-size:12.5px;min-width:0}
.meta h5{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600}
.mg{padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid var(--bd)}
.mg:last-child{border-bottom:0}
.mr{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;padding:3px 0;align-items:center}
.mr .l{color:var(--mut)}
.mr .v{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.stack{display:flex}.stack .av{border:2px solid var(--ed);margin-left:-5px}.stack .av:first-child{margin-left:0}
.tag{font-size:11.5px;background:var(--hov);border-radius:3px;padding:1px 6px}
a.ln,button.ln{color:var(--link);text-decoration:none;border:0;background:none;padding:0;cursor:pointer;text-align:left}
a.ln:hover,button.ln:hover{text-decoration:underline}
.sum{display:flex;gap:28px;flex-wrap:wrap;margin:4px 0 14px}
.sum div{display:flex;flex-direction:column}
.sum b{font-size:18px;color:var(--fg2);font-variant-numeric:tabular-nums;font-weight:600}
.sum span{font-size:11.5px;color:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 0 18px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.wide-pad{padding:18px 28px 48px;max-width:1120px}
.foot{margin-top:14px;font-size:12px;color:var(--mut)}
.sum button,.legend button{border:0;background:none;padding:2px 4px;margin:-2px -4px;border-radius:4px;cursor:pointer;color:inherit;font:inherit;text-align:left}
.sum button{display:flex;flex-direction:column}
.sum button:hover,.legend button:hover{background:var(--hov)}
.sum button.on,.legend button.on{background:var(--sel)}
.sum button.dim,.legend button.dim{opacity:.45}
.rf-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.rf-bar .inp{width:240px;height:22px}
.rf-dd{position:relative}
.rf-bar .btn.on{border-color:var(--acc);background:var(--sel);color:var(--fg2)}
.rf-cv{display:inline-flex;transform:rotate(90deg);color:var(--mut)}.rf-cv svg{width:11px;height:11px}
.rf-n{min-width:16px;height:15px;border-radius:8px;background:var(--acc);color:var(--acc-fg);font-size:10.5px;display:inline-grid;place-items:center;padding:0 4px}
.rf-pop{position:absolute;top:calc(100% + 4px);left:0;z-index:20;min-width:240px;max-height:320px;overflow:auto;background:var(--wid,var(--in));border:1px solid var(--in-bd);border-radius:6px;box-shadow:0 8px 24px var(--shadow);padding:4px 0}
.rf-pop .qp-i{white-space:nowrap}
.rf-pop .qp-i.zero{opacity:.45}
.rf-pop .ti{width:14px;height:14px}
.rf-pf{display:flex;gap:10px;padding:6px 14px 4px;border-top:1px solid var(--bd);margin-top:4px}
.rf-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:22px;margin:0 0 10px;font-size:12px}
.rf-chips .sp{flex:1}
.rf-chips .chip b{font-weight:600;margin-right:2px}
.rf-sel{height:22px;border:1px solid var(--in-bd);background:var(--in);border-radius:3px;font-size:12px;padding:0 4px}
table.t tr.rf-gh td{background:var(--hov);font-weight:600;color:var(--fg2);padding:5px 8px}
.rf-gh .gh{display:flex;align-items:center;gap:10px}
.rf-gh .bar{width:120px;height:4px}
.rf-gh .desc{font-weight:400;color:var(--mut);font-variant-numeric:tabular-nums}
.rf-empty{padding:28px 0;text-align:center;color:var(--mut)}
.code{font:12.5px/20px var(--mono);padding:8px 0 40px;white-space:pre;counter-reset:ln;min-width:max-content}
.code div{padding:0 24px 0 64px;position:relative}
.code div::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:42px;text-align:right;color:var(--mut)}
.code .cmt{color:var(--green)}

/* overlays */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.32);display:flex;justify-content:center;align-items:flex-start;padding:56px 16px 16px;z-index:30}
.dlg{background:var(--side);border:1px solid var(--bd);border-radius:8px;box-shadow:0 12px 34px var(--shadow);width:min(540px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column}

  $('#filters').innerHTML=`<div class="grp">My Filters</div>${FILTERS.filter(f=>f.own).map(row).join('')}<div class="grp">Jira Favorites</div>${FILTERS.filter(f=>!f.own).map(row).join('')}`;
}
function projSelect(id,val){
  return `<div class="ctl"><select class="sel" id="${id}" data-chg="${id}" aria-label="Project">${INST.map(x=>`<optgroup label="${x.name}">${x.projects.map(p=>`<option value="${p}"${p==val?' selected':''}>${p}</option>`).join('')}</optgroup>`).join('')}</select></div>`;
}
function renderEpics(){
  const list=Object.keys(EPICS).filter(k=>k.split('-')[0]==S.epicProj);
  const c=cur();
  $('#epics').innerHTML=projSelect('epicProj',S.epicProj)+(list.length?list.map(k=>{
    const s=stats(ALL().filter(i=>i.epic==k));
    return `<div class="row${c&&c.kind=='epic'&&c.id==k?' on':''}" style="padding-left:22px" data-act="epic" data-k="${k}" tabindex="0">${TI.epic}<span class="lbl">${esc(EPICS[k].sum)} <span class="desc">${k}</span></span>${segBar(s,'mini')}<span class="desc" style="font-variant-numeric:tabular-nums">${s.done}/${s.total}</span></div>`;
  }).join(''):`<div class="empty">No unresolved epics in ${S.epicProj}</div>`);
}
function renderRels(){
  const list=REL.filter(r=>r.proj==S.relProj),c=cur();
  $('#rels').innerHTML=projSelect('relProj',S.relProj)+(list.length?list.map(r=>{
    const s=stats(ALL().filter(i=>i.fix==r.id));
    return `<div class="row${c&&c.kind=='rel'&&c.id==r.id?' on':''}" style="padding-left:22px" data-act="rel" data-id="${r.id}" tabindex="0" title="${r.released?'Released':'Unreleased'}">${r.released?IC.ok.replace('class="s16"','class="s16" style="color:var(--green)"'):IC.pend}<span class="lbl">${esc(r.name)} <span class="desc">${r.date?dd(r.date):'no date'}</span></span>${s.total?`<span class="desc" style="font-variant-numeric:tabular-nums">${s.done}/${s.total}</span>`:''}</div>`;
  }).join(''):`<div class="empty">No versions in ${S.relProj}</div>`);
}
function renderTempo(){
  const t=myDay(TODAY),pct=Math.min(100,t/WDM()*100);
  const todays=LOG.filter(l=>l.who==ME&&l.date==TODAY);
  $('#tempo').innerHTML=`<div class="tp">
    <div class="tp-top"><div><div class="sm mut">Today, Fri, October 2</div><div class="big">${fmt(t)}</div></div><div class="sm mut">of ${S.set.wd}h · ${fmt(Math.max(0,WDM()-t))} left</div></div>
    <div class="bar"><i class="b-acc" style="width:${pct}%"></i></div>
    <div class="tl">${todays.map(l=>`<div class="row" data-act="open" data-k="${l.key}" tabindex="0" title="${esc(l.c)}"><span class="k">${l.key}</span><span class="lbl mut">${esc(l.c)}</span><span class="t">${fmt(l.m)}</span></div>`).join('')}</div>
    <div class="row-btns"><button class="btn sm" data-act="refresh">Refresh</button><button class="btn sm pri" data-act="log" data-k="${cur()&&cur().kind=='issue'?cur().id:'HOME-710'}">${IC.clock} Log</button></div>
  </div>`;
}

/* ---------- editor ---------- */
function tabLabel(t){
  if(t.kind=='issue')return TI[I[t.id].type]+`<span>${t.id}</span>`;
  if(t.kind=='epic')return TI.epic+`<span>${t.id}</span>`;
  if(t.kind=='rel')return IC.tag+`<span>${esc(REL.find(r=>r.id==t.id).name)}</span>`;
  if(t.kind=='ts')return IC.cal+`<span>Tempo · week</span>`;
  if(t.kind=='set')return IC.gear.replace('<svg','<svg class="s16"')+`<span>Jiraffe Settings</span>`;
  return (t.id.endsWith('.php')?IC.php:IC.file)+`<span>${esc(t.id)}</span>`;
}
function renderTabs(){
  $('#tabs').innerHTML=S.tabs.map((t,n)=>`<div class="tab${n==S.active?' on':''}" role="tab" aria-selected="${n==S.active}" data-act="tab" data-n="${n}" tabindex="0">${tabLabel(t)}<button class="ib" data-act="tab-x" data-n="${n}" aria-label="Close">${IC.x}</button></div>`).join('');
}
function renderPane(){
  const t=cur(),p=$('#pane');
  if(!t){p.innerHTML=`<div class="wide-pad mut">Open an issue from the tree on the left.</div>`;return}
  p.innerHTML=t.kind=='issue'?vIssue(t.id):t.kind=='epic'?vEpic(t.id):t.kind=='rel'?vRel(t.id):t.kind=='ts'?vTS():t.kind=='set'?vSet():vFile(t.id);
}
function vFile(n){
  return `<div class="code">${FILES[n].map(l=>`<div class="${/^\s*\/\//.test(l)?'cmt':''}">${esc(l)||' '}</div>`).join('')}</div>`;
}
function shot(v){
  if(v==3)return `<svg viewBox="0 0 240 180" role="img" aria-label="Photo of the kiosk screen"><rect width="240" height="180" style="fill:#2c3138"/><rect x="20" y="14" width="200" height="140" rx="6" style="fill:#e9eef3"/><rect x="20" y="14" width="200" height="22" rx="6" style="fill:#1f5fa8"/><text x="32" y="29" style="fill:#fff;font:600 9px sans-serif">Support · Queue</text><text x="120" y="70" text-anchor="middle" style="fill:#1b2a3a;font:700 16px sans-serif">Ticket A-042</text><text x="120" y="88" text-anchor="middle" style="fill:#3c4a5a;font:9px sans-serif">Ticket issued</text><rect x="70" y="102" width="100" height="22" rx="4" style="fill:#1f5fa8"/><text x="120" y="117" text-anchor="middle" style="fill:#fff;font:600 9px sans-serif">Done</text><rect x="92" y="160" width="56" height="6" rx="3" style="fill:#121418"/></svg>`;
  const ev=[0,1,2,3,4].map(j=>{const y=172+j*28;
    if(v==2&&j>1)return j==2?`<circle cx="90" cy="${y+22}" r="9" style="fill:none;stroke:#3b82f6;stroke-width:2.5;stroke-dasharray:40 20"/><text x="90" y="${y+46}" text-anchor="middle" style="fill:#8a93a3;font:8px sans-serif">Loading…</text>`:'';
    return `<rect x="10" y="${y}" width="160" height="22" rx="4" style="fill:#1f232a"/><circle cx="21" cy="${y+11}" r="4" style="fill:${j%2?'#f59e0b':'#3b82f6'}"/><rect x="31" y="${y+6}" width="${70+j*9%40}" height="4" rx="2" style="fill:#c9ced6"/><rect x="31" y="${y+13}" width="44" height="3" rx="1.5" style="fill:#5d6573"/>`;}).join('');
  const marks=[14,22,30,47,52,66,80,95,101,118,130].map(x=>`<rect x="${10+x}" y="139" width="3" height="8" style="fill:${x>100&&v==1?'#3a3f48':'#3b82f6'}"/>`).join('');
  return `<svg viewBox="0 0 180 330" role="img" aria-label="Orbit app screenshot"><rect width="180" height="330" rx="14" style="fill:#121418"/><rect width="180" height="28" style="fill:#1b1e24"/><text x="12" y="18" style="fill:#e8e8e8;font:600 9px sans-serif">Entrance 2 · Archive</text><rect x="10" y="36" width="160" height="90" rx="6" style="fill:#262b33"/><path d="M82 70l20 11-20 11z" style="fill:#5d6573"/><rect x="10" y="134" width="160" height="18" rx="3" style="fill:#1b1e24"/>${marks}<path d="M${v==1?115:88} 131v24" style="stroke:#ef4444;stroke-width:1.5"/><text x="12" y="164" style="fill:#8a93a3;font:7px sans-serif">${v==1?'Aug 24':'Sep 2'}</text><text x="168" y="164" text-anchor="end" style="fill:#8a93a3;font:7px sans-serif">${v==1?'Aug 26':'Sep 4'}</text>${v==1?'<rect x="108" y="131" width="64" height="24" rx="3" style="fill:none;stroke:#ef4444;stroke-width:1.5"/>':''}${ev}</svg>`;
}
function vIssue(k){
  const i=I[k],x=ins(i.inst),sub=S.sub[k]||'desc',logs=logsOf(k),spent=logs.reduce((s,l)=>s+l.m,0);
  const hist=i.hist||[{who:i.rep,at:i.created+' 10:00',created:true}];
  const T=[['desc','Description'],['att','Attachments',i.att.length],['com','Comments',i.com.length],['hist','History',hist.length],['wl','Work Log',logs.length]];
  let body='';
  if(sub=='desc')body=`<div class="rich">${i.desc||`<p class="mut">No description.</p>`}</div>`;
  if(sub=='att')body=i.att.length?`<div class="toolbar"><span class="mut sm">${i.att.length} ${i.att.length==1?'file':'files'} · images are downloaded by the extension with authorization and shown here</span><span class="sp"></span><button class="btn sm" data-act="dl-all" data-k="${k}">${IC.dl} Download All</button></div>
    <div class="att-grid">${i.att.map((a,n)=>`<div class="att">${a.img?`<button class="th" data-act="img" data-k="${k}" data-n="${n}" aria-label="Open ${esc(a.n)}">${shot(a.img)}</button>`:`<div class="th file">${IC.file.replace('class="s16"','')}<span>.${a.n.split('.').pop()}</span></div>`}
      <div class="inf"><span class="nm" title="${esc(a.n)}">${esc(a.n)}</span><span class="mut">${a.size} · ${U[a.who][0]} · ${a.at}</span></div>
      <div class="ab">${FILES[a.n]?`<button class="btn sm" data-act="file" data-f="${esc(a.n)}">Open in Editor</button>`:''}<button class="btn sm" data-act="dl" data-k="${k}" data-f="${esc(a.n)}" aria-label="Download">${IC.dl}</button></div></div>`).join('')}</div>`:`<p class="mut">No attachments.</p>`;
  if(sub=='com')body=(i.com.length?i.com.map(c=>`<div class="cm">${av(c.who,28)}<div><div class="who"><b>${U[c.who][0]}</b><span class="mut sm">${c.at}</span></div><div class="tx">${c.t}</div></div></div>`).join(''):`<p class="mut">No comments.</p>`)+`<div class="ro-note">Comments are read-only in the MVP. Replying from VS Code is coming in the next version.</div>`;
  if(sub=='hist')body=hist.map(h=>`<div class="hi">${av(h.who,28)}<div><div class="who"><b>${U[h.who][0]}</b> <span class="mut sm">${h.at}</span></div>${h.created?`<div class="chg mut">created the issue</div>`:h.ch.map(c=>`<div class="chg"><span class="f">${c[0]}</span>${c[1]=='—'?'':`<span class="old">${esc(c[1])}</span><span class="arr">→</span>`}<span>${esc(c[2])}</span></div>`).join('')}</div></div>`).join('');
  if(sub=='wl')body=`<div class="toolbar"><span class="src">${x.tempo?`${IC.clock} Tempo Timesheets · attributes “Work Type”, “AI Tokens”`:`${IC.info} No Tempo on ${x.name} — using the standard Jira work log`}</span><span class="sp"></span><button class="btn sm pri" data-act="log" data-k="${k}">${IC.clock} Log Work</button></div>
    ${logs.length?`<div class="tw-wrap"><table class="t"><thead><tr><th>Who</th><th>Date</th><th class="num">Time</th><th>Comment</th>${x.tempo?'<th>Work Type</th><th class="num">AI Tokens</th>':''}</tr></thead>
    <tbody>${logs.map(l=>`<tr><td>${person(l.who)}</td><td class="num" style="text-align:left">${dd(l.date)}</td><td class="num">${fmt(l.m)}</td><td>${esc(l.c)}</td>${x.tempo?`<td>${esc(l.wt)}</td><td class="num">${tok(l.tok)}</td>`:''}</tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td></td><td class="num">${fmt(spent)}</td><td></td>${x.tempo?`<td></td><td class="num">${tok(logs.reduce((s,l)=>s+(l.tok||0),0))}</td>`:''}</tr></tfoot></table></div>`:`<p class="mut">No entries yet.</p>`}`;
  const rem=Math.max(0,i.est-spent),over=i.est&&spent>i.est;
  const rel=i.fix&&REL.find(r=>r.id==i.fix);
  return `<div class="iv">
    <div class="iv-head">
      <div class="crumbs">${IC.server} ${x.name}<span>›</span>${i.proj}${i.epic?`<span>›</span><button class="ln" data-act="epic" data-k="${i.epic}">${i.epic}</button>`:''}<span>›</span>${TI[i.type]}<span class="k">${i.key}</span></div>
      <h1>${esc(i.sum)}</h1>
      <div class="hrow"><button class="pill pill-btn s-${i.status}" data-act="status" data-k="${k}" title="Change Status">${SL[i.status]} ▾</button><span class="prio">${PI[i.prio]}${PL[i.prio]}</span><span class="mut sm">${TL[i.type]}</span><span class="sp"></span>
        <button class="btn" data-act="copy" data-k="${k}">${IC.copy} Key</button>
        <a class="btn" href="https://${x.host}/browse/${k}" target="_blank" rel="noopener">${IC.ext} Open in Jira</a>
        <button class="btn" data-act="pin">${IC.pin} Pin</button>
        <button class="btn pri" data-act="log" data-k="${k}">${IC.clock} Log Work</button></div>
    </div>
    <div style="min-width:0">
      <div class="subtabs" role="tablist">${T.map(s=>`<button class="${s[0]==sub?'on':''}" role="tab" aria-selected="${s[0]==sub}" data-act="sub" data-k="${k}" data-s="${s[0]}">${s[1]}${s[2]!=null?`<span class="cnt">${s[2]}</span>`:''}</button>`).join('')}</div>
      ${body}
    </div>
    <aside class="meta">
      <div class="mg"><h5>People</h5>
        <div class="mr"><span class="l">Assignee</span><span class="v">${person(i.asg)}</span></div>
        <div class="mr"><span class="l">Reporter</span><span class="v">${person(i.rep)}</span></div>
        <div class="mr"><span class="l">Watchers</span><span class="v">${i.watchers.length?`<span class="stack">${i.watchers.map(w=>av(w,22)).join('')}</span><span class="mut">${i.watchers.length}</span>`:'<span class="mut">—</span>'}</span></div>
      </div>
      <div class="mg"><h5>Details</h5>
        <div class="mr"><span class="l">Epic</span><span class="v">${i.epic?`<button class="ln" data-act="epic" data-k="${i.epic}">${esc(EPICS[i.epic].sum)}</button>`:'<span class="mut">—</span>'}</span></div>
        <div class="mr"><span class="l">Release</span><span class="v">${rel?`<button class="ln" data-act="rel" data-id="${rel.id}">${esc(rel.name)}</button>`:'<span class="mut">—</span>'}</span></div>
        <div class="mr"><span class="l">Labels</span><span class="v">${i.labels.length?i.labels.map(l=>`<span class="tag">${l}</span>`).join(''):'<span class="mut">—</span>'}</span></div>
        <div class="mr"><span class="l">Components</span><span class="v">${i.comps.length?i.comps.join(', '):'<span class="mut">—</span>'}</span></div>
      </div>
      <div class="mg"><h5>Time</h5>
        <div class="mr"><span class="l">Estimate</span><span class="v">${i.est?fmt(i.est):'<span class="mut">—</span>'}</span></div>
        <div class="mr"><span class="l">Logged</span><span class="v">${spent?fmt(spent):'0m'}${over?' <span class="under">· over estimate</span>':''}</span></div>
        <div class="mr"><span class="l">Remaining</span><span class="v">${i.est?fmt(rem):'<span class="mut">—</span>'}</span></div>
        ${i.est?`<div class="bar" style="margin-top:6px"><i class="${over?'b-over':'b-acc'}" style="width:${Math.min(100,spent/i.est*100)}%"></i></div>`:''}
      </div>
      <div class="mg"><h5>Dates</h5>
        <div class="mr"><span class="l">Created</span><span class="v">${i.created}</span></div>
        <div class="mr"><span class="l">Updated</span><span class="v">${i.updated}</span></div>
        <div class="mr"><span class="l">Due</span><span class="v">${i.due||'<span class="mut">—</span>'}</span></div>
      </div>
    </aside>
  </div>`;
}
function issueTable(list,o){
  const row=i=>{const r=i.fix&&REL.find(z=>z.id==i.fix);return `<tr class="click" data-act="open" data-k="${i.key}" tabindex="0"><td>${TI[i.type]}</td><td class="k" style="white-space:nowrap">${i.key}</td><td>${esc(i.sum)}</td><td>${pill(i.status)}</td><td>${PI[i.prio]}</td><td>${person(i.asg)}</td>${o.rel?`<td class="mut" style="white-space:nowrap">${r?esc(r.name):'—'}</td>`:''}${o.epic?`<td class="mut" style="white-space:nowrap">${i.epic?esc(EPICS[i.epic].sum):'—'}</td>`:''}</tr>`};
  const head=`<div class="tw-wrap"><table class="t"><thead><tr><th></th><th>Key</th><th>Issue</th><th>Status</th><th>Priority</th><th>Assignee</th>${o.rel?'<th>Release</th>':''}${o.epic?'<th>Epic</th>':''}</tr></thead><tbody>`;
  if(o.grp&&o.grp!='none'){
    const G=RFG[o.grp],span=6+(o.rel?1:0)+(o.epic?1:0),m=new Map();
    for(const i of sortI(list)){const k=G.key(i);if(!m.has(k))m.set(k,[]);m.get(k).push(i)}
    return head+[...m.entries()].sort((a,b)=>G.ord(a,b)).map(([k,l])=>{const s=stats(l);return `<tr class="rf-gh"><td colspan="${span}"><div class="gh">${G.lab(k)}<span class="desc">${s.done}/${s.total} done</span>${segBar(s)}</div></td></tr>`+l.map(row).join('')}).join('')+'</tbody></table></div>';
  }
  return head+`
  ${sortI(list).map(i=>{const r=i.fix&&REL.find(z=>z.id==i.fix);return `<tr class="click" data-act="open" data-k="${i.key}" tabindex="0"><td>${TI[i.type]}</td><td class="k" style="white-space:nowrap">${i.key}</td><td>${esc(i.sum)}</td><td>${pill(i.status)}</td><td>${PI[i.prio]}</td><td>${person(i.asg)}</td>${o.rel?`<td class="mut" style="white-space:nowrap">${r?esc(r.name):'—'}</td>`:''}${o.epic?`<td class="mut" style="white-space:nowrap">${i.epic?esc(EPICS[i.epic].sum):'—'}</td>`:''}</tr>`}).join('')}</tbody></table></div>`;
}
function progressBlock(s,st){
  const pct=s.total?Math.round(s.done/s.total*100):0;
  if(!st)return `<div class="sum"><div><b>${s.done} of ${s.total}</b><span>done · ${pct}%</span></div><div><b>${s.prog+s.rev}</b><span>in progress</span></div><div><b>${s.todo}</b><span>not started</span></div></div>
  ${segBar(s)}<div class="legend"><span><i class="b-done"></i>Done ${s.done}</span><span><i class="b-rev"></i>In Review ${s.rev}</span><span><i class="b-prog"></i>In Progress ${s.prog}</span><span><i style="background:var(--track)"></i>To Do ${s.todo}</span></div>`;
  // release: the tiles and the legend toggle the status filter
  const cls=vs=>{const on=vs.every(v=>st.has(v));return on?' on':st.size?' dim':''};
  const b=(vs,inner,t)=>`<button class="${cls(vs).trim()}" data-act="rf-st" data-v="${vs.join(',')}" aria-pressed="${vs.every(v=>st.has(v))}" title="${t}">${inner}</button>`;
  return `<div class="sum">${b(['done'],`<b>${s.done} of ${s.total}</b><span>done · ${pct}%</span>`,'Show only Done')}${b(['prog','review'],`<b>${s.prog+s.rev}</b><span>in progress</span>`,'Show In Progress and In Review')}${b(['todo'],`<b>${s.todo}</b><span>not started</span>`,'Show only To Do')}</div>
  ${segBar(s)}<div class="legend">${[['done','b-done','Done',s.done],['review','b-rev','In Review',s.rev],['prog','b-prog','In Progress',s.prog],['todo','','To Do',s.todo]].map(([v,c,l,n])=>b([v],`<i class="${c}"${c?'':' style="background:var(--track)"'}></i>${l} ${n}`,`Filter: ${l}`)).join('')}</div>`;
}
function vEpic(k){
  const e=EPICS[k],p=k.split('-')[0],x=instOf(p),kids=ALL().filter(i=>i.epic==k);
  return `<div class="wide-pad"><div class="crumbs">${IC.server} ${x.name}<span>›</span>${p}<span>›</span>Epics</div>
  <h1 style="display:flex;align-items:center;gap:10px">${TI.epic.replace('class="ti"','class="ti" style="width:20px;height:20px"')}${esc(e.sum)}</h1>
  <div class="hrow" style="margin-bottom:16px"><span class="k">${k}</span>${pill(e.status)}<span class="sp"></span><button class="btn" data-act="refresh">Refresh</button><a class="btn" href="https://${x.host}/browse/${k}" target="_blank" rel="noopener">${IC.ext} Open in Jira</a></div>
  ${progressBlock(stats(kids))}${issueTable(kids,{rel:1})}
  <p class="foot">Server/DC: epic issues are looked up by the Epic Link field. Jira Cloud: epic issues are looked up by <code>parent</code>.</p></div>`;
}
function vRel(id){
  const r=REL.find(z=>z.id==id),x=instOf(r.proj),kids=ALL().filter(i=>i.fix==id);
  const left=r.date&&!r.released?daysBetween(TODAY,r.date):null;
  return `<div class="wide-pad"><div class="crumbs">${IC.server} ${x.name}<span>›</span>${r.proj}<span>›</span>Releases</div>
  <h1 style="display:flex;align-items:center;gap:10px">${IC.tag.replace('class="s16"','style="width:20px;height:20px;color:var(--mut)"')}${esc(r.name)}</h1>
  <div class="hrow" style="margin-bottom:16px">${r.released?'<span class="pill s-done">Released</span>':'<span class="pill s-prog">Unreleased</span>'}
    <span class="sm">${r.start?`Start ${dd(r.start)}`:'No start date'} · ${r.date?`${r.released?'Released':'Release'} ${dd(r.date)}`:'no release date'}${left!=null?` · <b>${left} d left</b>`:''}</span>
    ${r.desc?`<span class="mut sm">${esc(r.desc)}</span>`:''}<span class="sp"></span><button class="btn" data-act="refresh">Refresh</button><a class="btn" href="https://${x.host}/projects/${r.proj}?selectedItem=com.atlassian.jira.jira-projects-plugin:release-page" target="_blank" rel="noopener">${IC.ext} Open in Jira</a></div>
  ${kids.length?relBody(r,kids):'<p class="mut">This version has no issues yet.</p>'}</div>`;

function rfApply(list,f,skip){

    &&(skip=='st'||!f.st.size||f.st.has(i.status))

function parseDur(s){
  s=s.trim().toLowerCase().replace(/,/g,'.');
  if(!s||!/^(\s*\d+(\.\d+)?\s*(min|h|m)?\s*)+$/.test(s))return 0;
  let m=0,r;const re=/(\d+(?:\.\d+)?)\s*(min|h|m)?/g;
  while((r=re.exec(s))){const v=parseFloat(r[1]),u=r[2];m+=(!u||u=='h')?v*60:v}
  return Math.round(m);
}

    setRow({cat:'Connections',t:'Instances of this workspace',w:'ws',id:'jiraffe.instances',d:'Which Jira instances to show and poll in this folder. Handy when one window has a work project and another a personal one.',
      c:`<div class="radios"><label><input type="radio" name="st-scope" value="all" data-chg="st-scope"${v.scope=='all'?' checked':''}> All connected</label><label><input type="radio" name="st-scope" value="some" data-chg="st-scope"${v.scope=='some'?' checked':''}> Only the checked ones below</label></div>`,
      x:v.scope=='some'?`<div class="hint">${IC.info} Now in .vscode/settings.json: <code>"jiraffe.instances": [${INST.filter(x=>v.ws[x.id]).map(x=>`"${x.id}"`).join(', ')}]</code></div>`:''})
    +INST.map(instCard).join(''),
    `<button class="btn sm pri" data-act="add-inst">${IC.plus} Connect Jira</button>`);
  const list=sec('list','Issue list','',
    setRow({cat:'List',t:'Issues per request',k:'max',w:'user',id:'jiraffe.maxResults',d:'How many issues to load at once and per "Load More". More means a longer first response from Jira.',c:`<input class="n" type="number" min="1" max="100" value="${v.max}" data-chg="st-num" data-k="max" aria-label="Issues per request"><span class="mut sm">from 1 to 100</span>`})
    +setRow({cat:'List',t:'Sorting',k:'sort',w:'state',d:'Order of issues in the tree. Same as the sort button in the Issues header: changing it here changes it there.',c:`<select data-chg="st-sel" data-k="sort" aria-label="Sorting">${Object.entries(SORTS).map(([k,t])=>`<option value="${k}"${v.sort==k?' selected':''}>${t}</option>`).join('')}</select>`})
    +setRow({cat:'List',t:'Group by project',k:'grp',w:'state',d:'Within an instance, issues are grouped by project. Off means a flat list.',c:sw('grp',v.grp,'Group by project')}));
  const att=sec('att','Attachments','',
    setRow({cat:'Attachments',t:'Attachments folder',k:'dir',w:'user',id:'jiraffe.attachmentsDir',d:'A path relative to the first workspace folder; an issue\'s files go to a subfolder named after its key. An absolute path is accepted only in user settings. With no folder open, a temporary directory is used and cleaned after a week.',
      c:`<input class="t" value="${esc(v.dir)}" data-chg="st-txt" data-k="dir" aria-label="Attachments folder" spellcheck="false"><button class="btn sm" data-act="set-toast" data-m="In the extension this is the system dialog for choosing a folder inside the workspace.">${IC.folder} Choose…</button>`,
      x:`<div class="hint">${IC.folder} For example: <code>~/Projects/jiraffe/${esc(v.dir.replace(/^\.\/|\/$/g,''))}/HOME-710/screen-archive.png</code></div>${v.gi?'':`<div class="hint warn">${IC.warn} The folder is not in .gitignore: screenshots and files from issues may end up in a commit. <button class="lnk" data-act="set-gi">Add /${esc(v.dir.replace(/^\.\/|\/$/g,''))}/ to .gitignore</button></div>`}`})
    +setRow({cat:'Attachments',t:'Image size limit',k:'img',w:'user',id:'jiraffe.maxImageMb',d:'Larger images get no preview in the card or the description, only the Download button. Saves traffic on heavy screenshots.',c:`<input class="n" type="number" min="1" max="50" value="${v.img}" data-chg="st-num" data-k="img" aria-label="Image size limit, MB"><span class="mut sm">MB</span>`}));
  const time=sec('time','Time tracking','',
    setRow({cat:'Time',t:'Workday length',k:'wd',w:'user',id:'jiraffe.workdayHours',d:'The daily norm in the Tempo summary and the status bar.',c:`<input class="n" type="number" min="1" max="24" step="0.5" value="${v.wd}" data-chg="st-num" data-k="wd" aria-label="Workday length, hours"><span class="mut sm">hours · in the status bar: <b style="color:var(--fg2)">Today ${fmt(myDay(TODAY))} / ${v.wd}h</b></span>`})
    +setRow({cat:'Time',t:'Where time is logged',w:'auto',d:'Chosen per instance: with Tempo, the entry goes to Tempo (with a work type and AI Tokens); without it, to the issue\'s standard Jira work log.',c:`<div class="tw-wrap" style="width:100%"><table class="t" style="max-width:520px"><tbody>${INST.map(x=>`<tr><td>${x.name}</td><td>${x.tempo?'Tempo':'Jira work log'}</td><td class="mut sm">${x.tempo?'work type, AI Tokens':'AI Tokens go to the comment'}</td></tr>`).join('')}</tbody></table></div>`}));
  const int=sec('int','Integrations','',
    setRow({cat:'Agentura',t:'AI chat on an issue',w:'auto',d:'The "Open in Agentura" button in the issue card: a chat about the issue. It appears on its own when the Agentura extension is installed.',c:`<span class="ok" style="display:flex;align-items:center;gap:4px">${IC.ok} Agentura found</span><span class="mut sm">· each issue has its own chats</span>`})
    +setRow({cat:'API',t:'Access for other extensions',k:'api',w:'user',isNew:true,d:'Jiraffe\'s public API: other extensions (for example, Agentura) see the instances of this workspace, read issues and open the card. Tokens and email are never passed out. Set in user settings only: a project\'s .vscode/settings.json cannot change it.',c:sw('api',v.api,'Access for other extensions')})
    +(v.api?setRow({cat:'API',t:'Allow writing on your behalf',k:'apiW',w:'user',isNew:true,d:'API v2: comment, status change, work log. Every action is performed as your Jira account. Off means extensions can only read. Set in user settings only.',c:sw('apiW',v.apiW,'Allow writing on your behalf'),
      x:`<div class="hint">${IC.info} Last write attempt via the API: Agentura · comment · HOME-710 · today 13:48</div>`}):''));
  const body=conn+list+att+time+int;
  return `<div class="st"><nav class="st-nav" aria-label="Settings sections">${SECS.map(([id,t,ic])=>`<button class="${v.sec==id?'on':''}" data-act="set-sec" data-sec="${id}">${ic.replace('class="s16"','')}${t}${id=='conn'&&errs?`<span class="badge" title="There are connection problems">${errs}</span>`:''}</button>`).join('')}</nav>
  <div class="st-main"><div class="st-top"><label class="inp" for="st-q">${IC.search}<input id="st-q" placeholder="Find a setting: attachments, workday…" autocomplete="off" value="${esc(v.q)}"></label><span class="sp"></span><button class="lnk" data-act="set-toast" data-m="Opens VS Code settings.json at the jiraffe.* section">${IC.ext.replace('<svg','<svg style="width:13px;height:13px;vertical-align:-2px"')} settings.json</button></div>
  <div class="mut sm">Changes apply immediately, there is no Save button. A blue bar on the left means the value differs from the default.</div>
  <div id="st-body">${body}</div><div class="st-empty" id="st-none" hidden>Nothing found. Try "folder" or "hours".</div></div></div>`;
}
function setFilter(){
  const q=S.set.q.trim().toLowerCase(),b=$('#st-body');if(!b)return;
  let any=false;
  b.querySelectorAll('.st-sec').forEach(sec=>{let n=0;
    sec.querySelectorAll('.set').forEach(r=>{const m=!q||r.dataset.q.includes(q);r.hidden=!m;if(m)n++});
    sec.querySelectorAll('.ic').forEach(c=>{const m=!q||c.textContent.toLowerCase().includes(q)||'connection token instance'.includes(q);c.hidden=!m;if(m)n++});
    sec.hidden=!n;if(n)any=true});
  $('#st-none').hidden=any;
}
function rerenderSet(focusSel){const p=$('#pane'),y=p.scrollTop;renderPane();p.scrollTop=y;setFilter();renderSB();if(focusSel){const f=$(focusSel);if(f)f.focus()}}
const A={
  open:t=>openTab('issue',t.dataset.k),
  'by-key':t=>toast(`There is no issue ${t.dataset.k} in the prototype. The extension loads it by key from the matching instance.`),
  inst:t=>{S.closedInst[t.dataset.id]=!S.closedInst[t.dataset.id];renderTree()},
  mode:t=>{S.mode=t.dataset.m;if(S.mode!='jql')S.saved=null;S.collapsed.issues=false;renderViews();renderExtra();renderTree();renderFilters()},
  view:(t,e)=>{if(e.target.closest('.ib'))return;S.collapsed[t.dataset.v]=!S.collapsed[t.dataset.v];renderViews()},
  qp:()=>{S.ov='qp';showOv(qpHtml())},
  status:t=>{S.ov='st';showOv(stHtml(t.dataset.k))},
  'st-set':t=>{const k=t.dataset.k,s=t.dataset.s;I[k].status=s;closeOv();render();toast(`Jiraffe: ${k} → ${SL[s]}`)},
  pin:t=>toast('Jiraffe: issue card pinned'),
  'qp-t':t=>{const s=S.f[t.dataset.g],v=t.dataset.v;s.has(v)?s.delete(v):s.add(v);renderChips();renderTree();if(S.ov=='qp'){$('#ovl .ov').innerHTML=qpHtml();const el=$(`#ovl [data-g="${t.dataset.g}"][data-v="${v}"]`);if(el)el.focus()}},
  'qp-reset':()=>{for(const g in S.f)S.f[g].clear();renderChips();renderTree();if(S.ov=='qp')$('#ovl .ov').innerHTML=qpHtml()},
  'chip-x':t=>{S.f[t.dataset.g].delete(t.dataset.v);renderChips();renderTree()},
  'run-jql':()=>{S.jql=$('#jql').value;S.saved=null;renderExtra();renderTree();renderFilters()},
  'save-jql':()=>toast('In the extension the JQL is saved to local filters (globalState) and shows up under “My Filters”.'),
  saved:t=>{const f=FILTERS.find(z=>z.id==t.dataset.id);S.mode='jql';S.saved=f.id;S.jql=f.jql;S.collapsed.issues=false;renderViews();renderExtra();renderTree();renderFilters()},
  epic:t=>openTab('epic',t.dataset.k),
  rel:t=>openTab('rel',t.dataset.id),
  ts:()=>{S.collapsed.tempo=false;renderViews()},
  settings:t=>{openTab('set','main');setFilter();const s=t.dataset.sec;if(s)A['set-sec']({dataset:{sec:s}})},
  'set-sec':t=>{S.set.sec=t.dataset.sec;document.querySelectorAll('.st-nav button').forEach(b=>b.classList.toggle('on',b.dataset.sec==S.set.sec));const el=$('#st-'+S.set.sec);if(el)el.scrollIntoView({block:'start'})},
  'set-sw':t=>{const k=t.dataset.k;S.set[k]=!S.set[k];rerenderSet(`[data-act="set-sw"][data-k="${k}"]`);if(k=='grp')toast(S.set.grp?'Issues are grouped by project (the tree does not change in the prototype).':'Issues as a flat list (the tree does not change in the prototype).')},
  'set-rst':t=>{const k=t.dataset.k;S.set[k]=DEF[k];rerenderSet();render()},
  'set-ws':t=>{const id=t.dataset.id;S.set.ws[id]=!S.set.ws[id];rerenderSet(`[data-act="set-ws"][data-id="${id}"]`);renderTree()},
  'set-check':t=>{const x=ins(t.dataset.id);toast(x.err?`${x.name}: 401 — the token was rejected. Update the token.`:`${x.name}: connected as ${x.me.split(' · ')[0]}, ${x.ver}.`)},
  'set-caps':t=>{const x=ins(t.dataset.id);if(x.err){toast(`${x.name}: update the token first.`);return}x.chk='10-02 '+new Date().toTimeString().slice(0,5);rerenderSet();toast(`${x.name}: capabilities refreshed — ${x.tempo?'Tempo found':'no Tempo'}, Epic Link ${x.epic}.`)},
  'set-tok':t=>{const x=ins(t.dataset.id);S.ov='tok';showOv(`<div class="dlg" role="dialog" aria-label="Token ${esc(x.name)}"><div class="dlg-h">${IC.key.replace('<svg','<svg style="width:16px;height:16px"')} New token · ${esc(x.name)}<button class="ib" data-act="ov-x" aria-label="Close">${IC.x}</button></div>
    <div class="dlg-b"><div class="fld"><label for="tk-v">Personal Access Token</label><input id="tk-v" type="password" autocomplete="off"><small>Create it at ${x.host} → Profile → Personal Access Tokens. The old token is replaced only after a successful check.</small></div></div>
    <div class="dlg-f"><button class="btn" data-act="ov-x">Cancel</button><button class="btn pri" data-act="tok-save" data-id="${x.id}">Check and save</button></div></div>`)},
  'tok-save':t=>{const x=ins(t.dataset.id);delete x.err;x.chk='10-02 '+new Date().toTimeString().slice(0,5);closeOv();rerenderSet();toast(`${x.name}: the token was checked and saved to SecretStorage.`)},
  'set-del':t=>{const x=ins(t.dataset.id);toast(`In the extension this is a modal confirmation: "Disconnect ${x.name}? The token is removed from SecretStorage, and so are this instance's saved filters."`)},
  'set-gi':()=>{S.set.gi=true;rerenderSet();toast(`Added to .gitignore: /${S.set.dir.replace(/^\.\/|\/$/g,'')}/`)},
  'set-toast':t=>toast(t.dataset.m),
  file:t=>openTab('file',t.dataset.f),
  tab:(t,e)=>{if(e.target.closest('[data-act="tab-x"]'))return;S.active=+t.dataset.n;render()},
  'tab-x':t=>{const n=+t.dataset.n;S.tabs.splice(n,1);if(S.active>=n&&S.active>0)S.active--;if(!S.tabs.length)S.active=0;render()},
  sub:t=>{S.sub[t.dataset.k]=t.dataset.s;openTab('issue',t.dataset.k)},
  copy:t=>{const k=t.dataset.k;try{navigator.clipboard.writeText(k).then(()=>toast('Key copied: '+k),()=>toast('Could not copy. Key: '+k))}catch(_){toast('Could not copy. Key: '+k)}},
  img:t=>{const a=I[t.dataset.k].att[+t.dataset.n];S.ov='lb';showOv(`<div class="lb-box" role="dialog" aria-label="${esc(a.n)}">${shot(a.img)}<div class="hrow" style="width:100%"><span class="nm">${esc(a.n)}</span><span class="mut sm">${a.size} · ${U[a.who][0]}</span><span class="sp"></span><button class="btn sm" data-act="dl" data-k="${t.dataset.k}" data-f="${esc(a.n)}">${IC.dl} Download</button><button class="btn sm" data-act="ov-x">Close</button></div></div>`)},
  dl:t=>toast(`Saved: .jiraffe/${t.dataset.k}/${t.dataset.f}`),
  'dl-all':t=>toast(`Saved ${I[t.dataset.k].att.length} files to .jiraffe/${t.dataset.k}/`),
  log:t=>{S.ov='log';showOv(logHtml(t.dataset.k,t.dataset.d||TODAY));const d=$('#lg-dur');if(d){d.focus();d.select()}},
  'log-save':t=>{
    const k=t.dataset.k,m=parseDur($('#lg-dur').value),d=$('#lg-date').value,err=$('#lg-err');
    if(!m||m>1440){err.textContent='Couldn\'t parse the duration. Try something like 1h 30m or 90m.';err.hidden=false;$('#lg-dur').focus();return}
    if(!d){err.textContent='Enter the date as YYYY-MM-DD.';err.hidden=false;return}
    const x=ins(I[k].inst),tk=$('#lg-tok')?parseInt($('#lg-tok').value.replace(/\D/g,''),10)||null:null;
    let cm=$('#lg-c').value.trim();if(!x.tempo&&tk){cm=(cm?cm+' ':'')+`(AI Tokens: ${tk.toLocaleString('en-US')})`}
    LOG.push(L(k,ME,d,m,cm||'—',x.tempo?tk:null,$('#lg-type')?$('#lg-type').value:'Development'));
    closeOv();S.sub[k]=S.sub[k]||'desc';
    const c=cur();if(c&&c.kind=='issue'&&c.id==k)S.sub[k]='wl';
    render();toast(`Jiraffe: Logged ${fmt(m)} to ${k} on ${dd(d)}${x.tempo?' · Tempo':' · Jira worklog'}`);
  },
  'add-inst':()=>{S.ov='ai';showOv(addInstHtml())},
  'ai-check':()=>{const r=$('#ai-res'),u=$('#ai-url').value.trim();r.hidden=false;
    if(!/^https:\/\/[^\s/]+\.[^\s]+/.test(u)){r.className='err';r.textContent='A URL like https://jira.example.com is required';return}
    r.className='mut sm';r.textContent='Checking the connection…';
    setTimeout(()=>{if(!$('#ai-res'))return;r.className='ok';r.textContent='Connected as Andrew Foster (afoster). Sample only: the prototype sends no request.'},700)},
  'ai-add':()=>{closeOv();toast('The prototype does not save the instance. In the extension it appears in the Issues tree.')},
  refresh:()=>toast(`Refreshed: ${INST.length} instances, ${ALL().filter(i=>i.asg==ME&&i.status!='done').length} open issues assigned to you.`),
  'ov-x':()=>closeOv(),
  'rf-dd':t=>{const g=t.dataset.g;S.rfOpen=S.rfOpen==g?null:g;rfRender()},
  'rf-t':t=>{const f=rfOf(cur().id),s=f[t.dataset.g],v=t.dataset.v;s.has(v)?s.delete(v):s.add(v);rfRender(`.rf-pop [data-v="${v}"]`)},
  'rf-only':t=>{const g=t.dataset.g,f=rfOf(cur().id),kids=ALL().filter(i=>i.fix==cur().id);f[g]=new Set(kids.map(RFF[g].get));rfRender()},
  'rf-clr':t=>{rfOf(cur().id)[t.dataset.g].clear();rfRender()},
  'rf-st':t=>{const s=rfOf(cur().id).st,vs=t.dataset.v.split(','),on=vs.every(v=>s.has(v));vs.forEach(v=>on?s.delete(v):s.add(v));rfRender()},
  'rf-x':t=>{rfOf(cur().id)[t.dataset.g].delete(t.dataset.v);rfRender()},
  'rf-mine':()=>{const f=rfOf(cur().id);f.mine=!f.mine;rfRender()},
  'rf-qx':()=>{rfOf(cur().id).q='';rfRender()},
  'rf-reset':()=>{const g=rfOf(cur().id).grp;S.rf[cur().id]=Object.assign(RF0(),{grp:g});S.rfOpen=null;rfRender()},
  'rf-jql':()=>{const r=REL.find(z=>z.id==cur().id);toast(`Copied: <code>${esc(rfJql(r,rfOf(r.id)))}</code>`)},
  'rf-save':()=>{const r=REL.find(z=>z.id==cur().id);toast(`Saved filter “${esc(r.proj)}: ${esc(r.name)} (filtered)” added to Filters in the Issues view. JQL: <code>${esc(rfJql(r,rfOf(r.id)))}</code>`)},
  'ov-bg':(t,e)=>{if(e.target===t)closeOv()},
};
document.addEventListener('click',e=>{if(S.rfOpen&&!e.target.closest('.rf-dd')){S.rfOpen=null;renderPane()}const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){if(t.tagName=='A')return;f(t,e)}});
document.addEventListener('keydown',e=>{
  if(e.key=='Escape'&&S.ov){closeOv();return}
  if(e.key=='Escape'&&S.rfOpen){const g=S.rfOpen;S.rfOpen=null;renderPane();const b=$(`#pane [data-act="rf-dd"][data-g="${g}"]`);if(b)b.focus();return}
  if((e.key=='Enter'||e.key==' ')&&e.target.matches('[data-act][tabindex]')&&e.target.tagName!='BUTTON'){e.preventDefault();e.target.click()}
  if(e.key=='Enter'&&e.target.id=='lg-dur'){e.preventDefault();const b=$('[data-act="log-save"]');if(b)b.click()}
  if(e.key=='Enter'&&(e.metaKey||e.ctrlKey)&&e.target.id=='jql'){A['run-jql']()}
});
document.addEventListener('change',e=>{
  const c=e.target.dataset.chg;if(!c)return;
  if(c=='proj'){S.proj=e.target.value;renderTree()}
  if(c=='epicProj'){S.epicProj=e.target.value;renderEpics()}
  if(c=='relProj'){S.relProj=e.target.value;renderRels()}
  if(c=='rf-grp'){rfOf(e.target.dataset.id).grp=e.target.value;renderPane()}
  if(c=='st-scope'){S.set.scope=e.target.value;rerenderSet(`input[name="st-scope"][value="${S.set.scope}"]`);renderTree()}
  if(c=='st-num'){const k=e.target.dataset.k,el=e.target,n=parseFloat(el.value),mn=+el.min,mx=+el.max;S.set[k]=isNaN(n)?DEF[k]:Math.min(mx,Math.max(mn,n));rerenderSet();renderTempo()}
  if(c=='st-sel'){S.set[e.target.dataset.k]=e.target.value;rerenderSet()}
  if(c=='st-txt'){const v=e.target.value.trim();S.set.dir=v||DEF.dir;S.set.gi=false;rerenderSet()}
  if(c=='ai-kind'){const cl=e.target.value=='cloud';$('#ai-email-w').hidden=!cl;$('#ai-tok-l').textContent=cl?'API token':'Personal Access Token'}
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;renderTree()});
document.addEventListener('input',e=>{if(e.target.id=='st-q'){S.set.q=e.target.value;setFilter()}
  if(e.target.id=='rf-q'){const pos=e.target.selectionStart;rfOf(e.target.dataset.id).q=e.target.value;renderPane();const el=$('#rf-q');el.focus();el.setSelectionRange(pos,pos)}});

renderStatic();renderViews();renderExtra();render();
window.__proto={S,A,openTab,render,showOv,closeOv,logHtml,qpHtml,cur,TODAY};
})();
</script>
